<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="32" cy="32" r="30" fill="#8D6E63" stroke="#5D4037" stroke-width="2"/>
  <g transform="translate(32, 32)">
    <!-- Ancient scroll -->
    <rect x="-14" y="-12" width="28" height="24" rx="2" fill="#FFF8E1" stroke="#8D6E63" stroke-width="1"/>
    <!-- Scroll rolls -->
    <circle cx="-14" cy="0" r="12" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1"/>
    <circle cx="14" cy="0" r="12" fill="#D7CCC8" stroke="#8D6E63" stroke-width="1"/>
    <!-- Scroll content area -->
    <rect x="-12" y="-10" width="24" height="20" fill="#FFF8E1"/>
    
    <!-- Ancient text lines -->
    <line x1="-10" y1="-6" x2="10" y2="-6" stroke="#8D6E63" stroke-width="1"/>
    <line x1="-10" y1="-2" x2="8" y2="-2" stroke="#8D6E63" stroke-width="1"/>
    <line x1="-10" y1="2" x2="10" y2="2" stroke="#8D6E63" stroke-width="1"/>
    <line x1="-10" y1="6" x2="6" y2="6" stroke="#8D6E63" stroke-width="1"/>
    
    <!-- Ancient symbols -->
    <g transform="translate(-6, -4)">
      <!-- Hieroglyph-like symbols -->
      <circle cx="0" cy="0" r="1" fill="#8D6E63"/>
      <rect x="2" y="-1" width="2" height="2" fill="#8D6E63"/>
      <path d="M 5 -1 L 7 1 L 5 1 Z" fill="#8D6E63"/>
    </g>
    
    <!-- Wax seal -->
    <circle cx="8" cy="8" r="3" fill="#D32F2F"/>
    <path d="M 8 6 L 10 8 L 8 10 L 6 8 Z" fill="#FFEB3B"/>
    
    <!-- Scroll handles -->
    <rect x="-16" y="-2" width="4" height="4" rx="2" fill="#8D6E63"/>
    <rect x="12" y="-2" width="4" height="4" rx="2" fill="#8D6E63"/>
    
    <!-- Age effects -->
    <circle cx="-8" cy="-8" r="1" fill="#8D6E63" opacity="0.3"/>
    <circle cx="6" cy="-6" r="0.8" fill="#8D6E63" opacity="0.3"/>
    <circle cx="-4" cy="8" r="1.2" fill="#8D6E63" opacity="0.3"/>
  </g>
</svg>