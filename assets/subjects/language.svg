<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="32" cy="32" r="30" fill="#FF9800" stroke="#F57C00" stroke-width="2"/>
  <g transform="translate(32, 32)">
    <!-- Open book -->
    <path d="M -12 -8 L -12 12 L 0 8 L 12 12 L 12 -8 L 0 -4 Z" fill="white" stroke="#333" stroke-width="1.5"/>
    <!-- Book spine -->
    <line x1="0" y1="-4" x2="0" y2="8" stroke="#333" stroke-width="1.5"/>
    <!-- Book pages -->
    <line x1="-10" y1="-4" x2="-2" y2="-6" stroke="#666" stroke-width="0.8"/>
    <line x1="-10" y1="-1" x2="-2" y2="-3" stroke="#666" stroke-width="0.8"/>
    <line x1="-10" y1="2" x2="-2" y2="0" stroke="#666" stroke-width="0.8"/>
    <line x1="-10" y1="5" x2="-2" y2="3" stroke="#666" stroke-width="0.8"/>
    
    <line x1="2" y1="-6" x2="10" y2="-4" stroke="#666" stroke-width="0.8"/>
    <line x1="2" y1="-3" x2="10" y2="-1" stroke="#666" stroke-width="0.8"/>
    <line x1="2" y1="0" x2="10" y2="2" stroke="#666" stroke-width="0.8"/>
    <line x1="2" y1="3" x2="10" y2="5" stroke="#666" stroke-width="0.8"/>
    
    <!-- Speech bubble -->
    <ellipse cx="6" cy="-12" rx="8" ry="5" fill="white" stroke="#333" stroke-width="1"/>
    <path d="M 2 -8 L 0 -4 L 4 -6 Z" fill="white" stroke="#333" stroke-width="1"/>
    
    <!-- Language symbols in speech bubble -->
    <text x="6" y="-10" text-anchor="middle" font-family="Arial" font-size="6" fill="#333">ABC</text>
    <text x="6" y="-14" text-anchor="middle" font-family="Arial" font-size="4" fill="#666">语言</text>
    
    <!-- Alphabet letters floating -->
    <text x="-16" y="-2" font-family="Arial" font-size="8" fill="white" opacity="0.8">A</text>
    <text x="16" y="4" font-family="Arial" font-size="8" fill="white" opacity="0.8">Z</text>
    <text x="-14" y="14" font-family="Arial" font-size="6" fill="white" opacity="0.6">α</text>
    <text x="14" y="-14" font-family="Arial" font-size="6" fill="white" opacity="0.6">ñ</text>
    
    <!-- Pen/quill -->
    <line x1="14" y1="8" x2="18" y2="12" stroke="#8D6E63" stroke-width="2"/>
    <circle cx="18" cy="12" r="1" fill="#8D6E63"/>
    <path d="M 14 8 L 16 6 L 17 7 L 15 9 Z" fill="#FFD54F"/>
  </g>
</svg>