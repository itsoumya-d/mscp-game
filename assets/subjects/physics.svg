  <g transform="translate(32, 32)">
    <!-- Atom nucleus -->
    <circle cx="0" cy="0" r="3" fill="#FF5722"/>
    <!-- Electron orbits -->
    <ellipse cx="0" cy="0" rx="12" ry="6" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="6" ry="12" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="10" ry="10" fill="none" stroke="white" stroke-width="2" opacity="0.6" transform="rotate(45)"/>
    <!-- Electrons -->
    <circle cx="12" cy="0" r="2" fill="#FFEB3B"/>
    <circle cx="-8" cy="4" r="2" fill="#FFEB3B"/>
    <circle cx="0" cy="-12" r="2" fill="#FFEB3B"/>
    <circle cx="7" cy="7" r="2" fill="#FFEB3B"/>
    <!-- Energy waves -->
    <path d="M -16 -8 Q -12 -12 -8 -8 Q -4 -4 0 -8 Q 4 -12 8 -8 Q 12 -4 16 -8" 
