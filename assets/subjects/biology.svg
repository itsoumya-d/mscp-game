<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="32" cy="32" r="30" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <g transform="translate(32, 32)">
    <!-- DNA Double Helix -->
    <!-- Left strand -->
    <path d="M -8 -16 Q -12 -8 -8 0 Q -4 8 -8 16" 
          fill="none" stroke="#81C784" stroke-width="3"/>
    <!-- Right strand -->
    <path d="M 8 -16 Q 4 -8 8 0 Q 12 8 8 16" 
          fill="none" stroke="#A5D6A7" stroke-width="3"/>
    
    <!-- Base pairs (horizontal connections) -->
    <line x1="-8" y1="-12" x2="8" y2="-12" stroke="white" stroke-width="2"/>
    <line x1="-8" y1="-6" x2="8" y2="-6" stroke="white" stroke-width="2"/>
    <line x1="-8" y1="0" x2="8" y2="0" stroke="white" stroke-width="2"/>
    <line x1="-8" y1="6" x2="8" y2="6" stroke="white" stroke-width="2"/>
    <line x1="-8" y1="12" x2="8" y2="12" stroke="white" stroke-width="2"/>
    
    <!-- Base pair markers -->
    <circle cx="-4" cy="-12" r="1.5" fill="#FF5722"/>
    <circle cx="4" cy="-12" r="1.5" fill="#2196F3"/>
    <circle cx="-4" cy="-6" r="1.5" fill="#FFEB3B"/>
    <circle cx="4" cy="-6" r="1.5" fill="#E91E63"/>
    <circle cx="-4" cy="0" r="1.5" fill="#2196F3"/>
    <circle cx="4" cy="0" r="1.5" fill="#FF5722"/>
    <circle cx="-4" cy="6" r="1.5" fill="#E91E63"/>
    <circle cx="4" cy="6" r="1.5" fill="#FFEB3B"/>
    <circle cx="-4" cy="12" r="1.5" fill="#FF5722"/>
    <circle cx="4" cy="12" r="1.5" fill="#2196F3"/>
    
    <!-- Phosphate groups -->
    <circle cx="-8" cy="-16" r="2" fill="white" opacity="0.8"/>
    <circle cx="8" cy="-16" r="2" fill="white" opacity="0.8"/>
    <circle cx="-8" cy="16" r="2" fill="white" opacity="0.8"/>
    <circle cx="8" cy="16" r="2" fill="white" opacity="0.8"/>
    
    <!-- Cell outline -->
    <ellipse cx="0" cy="0" rx="18" ry="20" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  </g>
</svg>