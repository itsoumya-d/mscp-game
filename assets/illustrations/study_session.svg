<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="#F3E5F5"/>
  
  <!-- Desk -->
  <rect x="50" y="120" width="200" height="60" rx="8" fill="#8D6E63"/>
  <rect x="45" y="115" width="210" height="10" rx="5" fill="#6D4C41"/>
  
  <!-- Person studying -->
  <g transform="translate(120, 80)">
    <!-- Head -->
    <circle cx="0" cy="0" r="15" fill="#FFDBCB"/>
    <!-- Hair -->
    <path d="M -15 -8 Q -10 -20 0 -18 Q 10 -20 15 -8 Q 12 -15 0 -15 Q -12 -15 -15 -8" fill="#8D6E63"/>
    <!-- Body -->
    <rect x="-12" y="15" width="24" height="30" rx="12" fill="#2196F3"/>
    <!-- Arms -->
    <ellipse cx="-18" cy="25" rx="6" ry="15" fill="#FFDBCB"/>
    <ellipse cx="18" cy="25" rx="6" ry="15" fill="#FFDBCB"/>
    <!-- Hand writing -->
    <circle cx="25" cy="35" r="4" fill="#FFDBCB"/>
    <!-- Eyes -->
    <circle cx="-4" cy="-2" r="1.5" fill="#333"/>
    <circle cx="4" cy="-2" r="1.5" fill="#333"/>
    <!-- Smile -->
    <path d="M -4 4 Q 0 8 4 4" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Book -->
  <g transform="translate(80, 140)">
    <rect x="0" y="0" width="40" height="30" rx="2" fill="#FF5722"/>
    <rect x="2" y="2" width="36" height="26" fill="white"/>
    <line x1="5" y1="8" x2="35" y2="8" stroke="#333" stroke-width="1"/>
    <line x1="5" y1="12" x2="30" y2="12" stroke="#333" stroke-width="0.8"/>
    <line x1="5" y1="16" x2="35" y2="16" stroke="#333" stroke-width="0.8"/>
    <line x1="5" y1="20" x2="25" y2="20" stroke="#333" stroke-width="0.8"/>
  </g>
  
  <!-- Notebook -->
  <g transform="translate(160, 135)">
    <rect x="0" y="0" width="35" height="25" rx="2" fill="#4CAF50"/>
    <rect x="2" y="2" width="31" height="21" fill="white"/>
    <!-- Spiral binding -->
    <circle cx="8" cy="5" r="1" fill="none" stroke="#666" stroke-width="0.5"/>
    <circle cx="8" cy="10" r="1" fill="none" stroke="#666" stroke-width="0.5"/>
    <circle cx="8" cy="15" r="1" fill="none" stroke="#666" stroke-width="0.5"/>
    <circle cx="8" cy="20" r="1" fill="none" stroke="#666" stroke-width="0.5"/>
    <!-- Lines -->
    <line x1="12" y1="8" x2="30" y2="8" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="12" y1="12" x2="30" y2="12" stroke="#E0E0E0" stroke-width="0.5"/>
    <line x1="12" y1="16" x2="30" y2="16" stroke="#E0E0E0" stroke-width="0.5"/>
  </g>
  
  <!-- Pencil -->
  <g transform="translate(150, 125) rotate(15)">
    <rect x="0" y="0" width="40" height="4" fill="#FFD54F"/>
    <rect x="0" y="1" width="40" height="2" fill="#FFC107"/>
    <polygon points="40,0 45,2 40,4" fill="#8D6E63"/>
    <rect x="35" y="0.5" width="3" height="3" fill="#E91E63"/>
  </g>
  
  <!-- Coffee cup -->
  <g transform="translate(220, 145)">
    <rect x="0" y="5" width="20" height="15" rx="2" fill="white" stroke="#8D6E63" stroke-width="1"/>
    <ellipse cx="10" cy="5" rx="10" ry="2" fill="#8D6E63"/>
    <path d="M 20 10 Q 25 10 25 15 Q 25 20 20 20" fill="none" stroke="#8D6E63" stroke-width="1"/>
    <!-- Steam -->
    <path d="M 6 0 Q 8 -2 6 -4" fill="none" stroke="#E0E0E0" stroke-width="1" opacity="0.7"/>
    <path d="M 10 0 Q 12 -2 10 -4" fill="none" stroke="#E0E0E0" stroke-width="1" opacity="0.7"/>
    <path d="M 14 0 Q 16 -2 14 -4" fill="none" stroke="#E0E0E0" stroke-width="1" opacity="0.7"/>
  </g>
  
  <!-- Lamp -->
  <g transform="translate(60, 60)">
    <rect x="8" y="40" width="4" height="30" fill="#666"/>
    <circle cx="10" cy="40" r="3" fill="#666"/>
    <path d="M 0 20 Q 0 10 10 10 Q 20 10 20 20 L 18 30 L 2 30 Z" fill="#FFEB3B" opacity="0.8"/>
    <ellipse cx="10" cy="20" rx="10" ry="3" fill="#FFF176"/>
    <!-- Light rays -->
    <line x1="10" y1="30" x2="80" y2="50" stroke="#FFEB3B" stroke-width="1" opacity="0.3"/>
    <line x1="10" y1="30" x2="120" y2="40" stroke="#FFEB3B" stroke-width="1" opacity="0.3"/>
    <line x1="10" y1="30" x2="160" y2="60" stroke="#FFEB3B" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Floating knowledge symbols -->
  <g opacity="0.6">
    <text x="250" y="40" font-family="Arial" font-size="16" fill="#9C27B0">∑</text>
    <text x="270" y="60" font-family="Arial" font-size="14" fill="#2196F3">π</text>
    <text x="260" y="80" font-family="Arial" font-size="12" fill="#4CAF50">√</text>
    <text x="280" y="100" font-family="Arial" font-size="10" fill="#FF5722">∞</text>
    <text x="20" y="30" font-family="Arial" font-size="14" fill="#FF9800">ABC</text>
    <text x="30" y="50" font-family="Arial" font-size="12" fill="#E91E63">123</text>
  </g>
  
  <!-- Motivational elements -->
  <g transform="translate(200, 30)">
    <!-- Star -->
    <path d="M 0 -8 L 2 -2 L 8 -2 L 3 2 L 5 8 L 0 4 L -5 8 L -3 2 L -8 -2 L -2 -2 Z" fill="#FFD700"/>
    <!-- Sparkles -->
    <circle cx="-12" cy="-5" r="1" fill="#FFD700"/>
    <circle cx="12" cy="-3" r="0.8" fill="#FFD700"/>
    <circle cx="-8" cy="8" r="1.2" fill="#FFD700"/>
    <circle cx="10" cy="10" r="0.9" fill="#FFD700"/>
  </g>
</svg>