<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="url(#celebrationGradient)"/>
  
  <defs>
    <linearGradient id="celebrationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3E5F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Confetti -->
  <g opacity="0.8">
    <rect x="50" y="20" width="4" height="4" fill="#FF5722" transform="rotate(45 52 22)"/>
    <rect x="100" y="30" width="3" height="3" fill="#2196F3" transform="rotate(30 101.5 31.5)"/>
    <rect x="150" y="15" width="5" height="5" fill="#4CAF50" transform="rotate(60 152.5 17.5)"/>
    <rect x="200" y="25" width="4" height="4" fill="#FF9800" transform="rotate(15 202 27)"/>
    <rect x="250" y="35" width="3" height="3" fill="#9C27B0" transform="rotate(75 251.5 36.5)"/>
    <rect x="80" y="40" width="4" height="4" fill="#FFEB3B" transform="rotate(90 82 42)"/>
    <rect x="180" y="45" width="3" height="3" fill="#E91E63" transform="rotate(120 181.5 46.5)"/>
    <rect x="220" y="50" width="5" height="5" fill="#00BCD4" transform="rotate(45 222.5 52.5)"/>
  </g>
  
  <!-- Central character celebrating -->
  <g transform="translate(150, 100)">
    <!-- Head -->
    <circle cx="0" cy="-20" r="18" fill="#FFDBCB"/>
    <!-- Hair -->
    <path d="M -18 -28 Q -12 -35 0 -32 Q 12 -35 18 -28 Q 15 -32 0 -32 Q -15 -32 -18 -28" fill="#8D6E63"/>
    <!-- Body -->
    <rect x="-15" y="0" width="30" height="40" rx="15" fill="#4CAF50"/>
    <!-- Arms raised in celebration -->
    <ellipse cx="-25" cy="5" rx="8" ry="18" fill="#FFDBCB" transform="rotate(-30 -25 5)"/>
    <ellipse cx="25" cy="5" rx="8" ry="18" fill="#FFDBCB" transform="rotate(30 25 5)"/>
    <!-- Hands -->
    <circle cx="-35" cy="-5" r="5" fill="#FFDBCB"/>
    <circle cx="35" cy="-5" r="5" fill="#FFDBCB"/>
    <!-- Legs -->
    <ellipse cx="-8" cy="50" rx="6" ry="20" fill="#2196F3"/>
    <ellipse cx="8" cy="50" rx="6" ry="20" fill="#2196F3"/>
    <!-- Feet -->
    <ellipse cx="-8" cy="70" rx="8" ry="4" fill="#333"/>
    <ellipse cx="8" cy="70" rx="8" ry="4" fill="#333"/>
    
    <!-- Face -->
    <!-- Eyes -->
    <circle cx="-6" cy="-22" r="2" fill="white"/>
    <circle cx="6" cy="-22" r="2" fill="white"/>
    <circle cx="-6" cy="-22" r="1.2" fill="#333"/>
    <circle cx="6" cy="-22" r="1.2" fill="#333"/>
    <!-- Big smile -->
    <path d="M -8 -15 Q 0 -10 8 -15" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <!-- Cheeks -->
    <circle cx="-12" cy="-18" r="3" fill="#FFB6C1" opacity="0.6"/>
    <circle cx="12" cy="-18" r="3" fill="#FFB6C1" opacity="0.6"/>
  </g>
  
  <!-- Trophy -->
  <g transform="translate(100, 140)">
    <path d="M -8 -15 L -8 5 Q -8 10 -4 10 L 4 10 Q 8 10 8 5 L 8 -15 Z" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
    <path d="M -8 -10 Q -15 -10 -15 -5 Q -15 0 -8 0" fill="none" stroke="#FFD700" stroke-width="2"/>
    <path d="M 8 -10 Q 15 -10 15 -5 Q 15 0 8 0" fill="none" stroke="#FFD700" stroke-width="2"/>
    <rect x="-6" y="10" width="12" height="4" fill="#FFA500"/>
    <rect x="-8" y="14" width="16" height="6" rx="2" fill="#FF9800"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#FF9800">1st</text>
  </g>
  
  <!-- Medal -->
  <g transform="translate(200, 140)">
    <circle cx="0" cy="0" r="12" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="white"/>
    <path d="M 0 -15 L -3 -8 L 3 -8 Z" fill="#FF5722"/>
    <path d="M -3 -8 L -3 -25 L 3 -25 L 3 -8" fill="#FF5722"/>
    <text x="0" y="2" text-anchor="middle" font-family="Arial" font-size="6" font-weight="bold" fill="#FFD700">★</text>
  </g>
  
  <!-- Floating achievement badges -->
  <g transform="translate(50, 80)">
    <circle cx="0" cy="0" r="15" fill="#2196F3" opacity="0.8"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial" font-size="12" fill="white">✓</text>
  </g>
  
  <g transform="translate(250, 90)">
    <circle cx="0" cy="0" r="12" fill="#FF5722" opacity="0.8"/>
    <text x="0" y="3" text-anchor="middle" font-family="Arial" font-size="10" fill="white">🔥</text>
  </g>
  
  <!-- Sparkles and stars -->
  <g opacity="0.7">
    <!-- Large stars -->
    <path d="M 70 60 L 72 66 L 78 66 L 73.5 70 L 75.5 76 L 70 72 L 64.5 76 L 66.5 70 L 62 66 L 68 66 Z" fill="#FFD700"/>
    <path d="M 230 70 L 232 76 L 238 76 L 233.5 80 L 235.5 86 L 230 82 L 224.5 86 L 226.5 80 L 222 76 L 228 76 Z" fill="#FFD700"/>
    
    <!-- Small sparkles -->
    <circle cx="90" cy="50" r="2" fill="#FFEB3B"/>
    <circle cx="210" cy="55" r="1.5" fill="#FFEB3B"/>
    <circle cx="120" cy="70" r="2.5" fill="#FFEB3B"/>
    <circle cx="180" cy="65" r="1.8" fill="#FFEB3B"/>
    <circle cx="60" cy="120" r="2" fill="#FFEB3B"/>
    <circle cx="240" cy="110" r="1.5" fill="#FFEB3B"/>
    
    <!-- Plus signs -->
    <g transform="translate(40, 100)">
      <line x1="-3" y1="0" x2="3" y2="0" stroke="#FF9800" stroke-width="2"/>
      <line x1="0" y1="-3" x2="0" y2="3" stroke="#FF9800" stroke-width="2"/>
    </g>
    <g transform="translate(260, 120)">
      <line x1="-2" y1="0" x2="2" y2="0" stroke="#FF9800" stroke-width="1.5"/>
      <line x1="0" y1="-2" x2="0" y2="2" stroke="#FF9800" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- Celebration text -->
  <text x="150" y="180" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#4CAF50">Congratulations!</text>
</svg>