<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Badge background -->
  <circle cx="32" cy="32" r="30" fill="url(#goldGradient)" stroke="#B8860B" stroke-width="2"/>
  
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Inner circle -->
  <circle cx="32" cy="32" r="22" fill="white" opacity="0.9"/>
  
  <!-- Achievement icon - First lesson (book with star) -->
  <g transform="translate(32, 32)">
    <!-- Open book -->
    <path d="M -8 -4 L -8 8 L 0 6 L 8 8 L 8 -4 L 0 -2 Z" fill="#2196F3" stroke="#1565C0" stroke-width="1"/>
    <line x1="0" y1="-2" x2="0" y2="6" stroke="#1565C0" stroke-width="1"/>
    
    <!-- Star -->
    <path d="M 0 -12 L 2 -6 L 8 -6 L 3 -2 L 5 4 L 0 0 L -5 4 L -3 -2 L -8 -6 L -2 -6 Z" fill="#FFD700" stroke="#FFA500" stroke-width="1"/>
    
    <!-- Sparkles -->
    <circle cx="-10" cy="-8" r="1" fill="#FFD700"/>
    <circle cx="10" cy="-10" r="0.8" fill="#FFD700"/>
    <circle cx="-12" cy="2" r="1.2" fill="#FFD700"/>
    <circle cx="12" cy="4" r="0.9" fill="#FFD700"/>
  </g>
  
  <!-- Badge ribbon -->
  <path d="M 20 50 L 32 45 L 44 50 L 44 60 L 38 57 L 32 60 L 26 57 L 20 60 Z" fill="#FF5722"/>
  <path d="M 22 52 L 32 48 L 42 52 L 42 58 L 37 56 L 32 58 L 27 56 L 22 58 Z" fill="#FF7043"/>
</svg>